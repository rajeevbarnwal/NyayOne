[project]
name = "legalsaathi-backend"
version = "0.1.0"
description = "Backend API for LegalSaathi"
requires-python = ">=3.12"
dependencies = []

# Runtime dependencies stay in requirements.txt / are empty here.
# Test/dev dependencies are declared as an optional extra: `pip install ".[dev]"`.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
