# backend/requirements.lock — the EXACT interpreter-independent package set the
# backend is tested and gated against (F2).
#
# This file is the repository's single source of truth for runtime versions. It
# is used two ways:
#
#   1. as a pip CONSTRAINTS file for `backend/requirements.txt`
#        python -m pip install -r backend/requirements.txt          (the -c is
#        already inside requirements.txt, so nothing else is needed)
#   2. as the ALLOWED-VERSION manifest both runners enforce BEFORE they start
#      anything (backend/scripts/full_suite.sh and
#      scripts/wave2_tutoring_browser_gate.sh). A missing distribution, or one
#      whose installed version is not the pinned version, stops the run with a
#      prerequisite message naming the package, the pin and what was found.
#
# Provenance: derived from the interpreter that produced the green complete
# backend suite (771 passed / 2 skipped) and the green Wave 2 browser gate —
# `python -m pip freeze` of that environment, CPython 3.10.12. Nothing here is
# aspirational; every version below was actually executed.
#
# To move a pin: change it here, recreate backend/.venv from this file, re-run
# `bash backend/scripts/full_suite.sh 1` AND
# `bash scripts/wave2_tutoring_browser_gate.sh`, and only then commit.

