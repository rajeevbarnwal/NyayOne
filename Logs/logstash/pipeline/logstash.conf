input {
  file {
    id => "nyayone-backend-jsonl"
    path => "/workspace/Logs/app/backend.jsonl"
    start_position => "beginning"
    sincedb_path => "/workspace/Logs/logstash/state/backend.sincedb"
    codec => json
  }
}

filter {
  mutate {
    add_field => {
      "service" => "nyayone-backend"
      "log_collector" => "logstash"
    }
  }

  # SAATHI-398/402: normalize request_id to a SCALAR string.
  # The previous `mutate { add_field }` appended to an existing null/empty field,
  # producing the array ["none"] in Logstash 8.15.3. This ruby filter coerces
  # missing / JSON-null / empty / array values to the scalar string "none" and
  # leaves a valid id untouched — the output is never ["none"].
  ruby {
    id => "normalize-request-id"
    code => '
      v = event.get("request_id")
      v = v.first if v.is_a?(Array)
      if v.nil? || v.to_s.strip.empty?
        event.set("request_id", "none")
      else
        event.set("request_id", v.to_s)
      end
    '
  }
}

output {
  stdout {
    codec => rubydebug { metadata => false }
  }

  file {
    path => "/workspace/Logs/processed/backend-logstash.jsonl"
    codec => json_lines
  }
}
