input {
  file {
    id => "legalsaathi-backend-jsonl"
    path => "/workspace/Logs/app/backend.jsonl"
    start_position => "beginning"
    sincedb_path => "/workspace/Logs/logstash/state/backend.sincedb"
    codec => json
  }
}

filter {
  mutate {
    add_field => {
      "service" => "legalsaathi-backend"
      "log_collector" => "logstash"
    }
  }

  if ![request_id] or [request_id] == "" {
    mutate {
      add_field => { "request_id" => "none" }
    }
  }
}

output {
  stdout {
    codec => rubydebug { metadata => false }
  }

  file {
    path => "/workspace/Logs/processed/backend-logstash.jsonl"
    codec => json_lines
  }
}
