name: NYAY-5 profile authority gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyayone-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  profile-postgres-production-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: nyayone_ci
          POSTGRES_PASSWORD: nyayone_ci_ephemeral
          POSTGRES_DB: nyayone_nyay5_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nyayone_ci -d nyayone_nyay5_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://nyayone_ci:nyayone_ci_ephemeral@127.0.0.1:5432/nyayone_nyay5_ci
      NYAY5_POSTGRES_CONTROL_URL: postgresql+psycopg://nyayone_ci:nyayone_ci_ephemeral@127.0.0.1:5432/nyayone_nyay5_ci
      APP_ENV: testing
      REGISTRATION_SECRET: ci-nyay5-registration-encryption-secret-not-a-default
      REGISTRATION_LOOKUP_SECRET: ci-nyay5-registration-lookup-secret-not-a-default
      NYAY19_ISOLATED_MIGRATION_EXECUTE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt -c requirements.lock pytest
      - name: Install locked frontend and Chromium dependencies
        working-directory: frontend
        run: |
          npm ci
          npm exec -- playwright install --with-deps chromium
      - name: Run complete backend and PostgreSQL target-runtime gates
        run: (cd backend && PYTHON=python bash scripts/db_gate.sh)
      - name: Stage exact NYAY-5 and NYAY-4 PostgreSQL producer results
        run: |
          mkdir -p \
            "$GITHUB_WORKSPACE/test-results/nyay5-postgres" \
            "$GITHUB_WORKSPACE/test-results/nyay4-postgres"
          install -m 0600 backend/test-results/nyay5-postgres/summary.json "$GITHUB_WORKSPACE/test-results/nyay5-postgres/summary.json"
          install -m 0600 backend/test-results/nyay4-postgres/summary.json "$GITHUB_WORKSPACE/test-results/nyay4-postgres/summary.json"
      - name: Run isolated production-browser producer and cleanup gate
        run: bash scripts/nyay5_profile_browser_gate.sh "$GITHUB_WORKSPACE/test-results/nyay5-browser/results.json"
      - name: Seal and verify raw NYAY-5 browser evidence inventory
        run: python scripts/ci/evidence_manifest.py --seal "$GITHUB_WORKSPACE/test-results/nyay5-browser"
      - name: Produce executed NYAY-5 acceptance attestations
        run: >-
          python scripts/ci/nyay5_acceptance_attestations.py
          --browser "$GITHUB_WORKSPACE/test-results/nyay5-browser/results.json"
          --orchestrator "$GITHUB_WORKSPACE/test-results/nyay5-browser/orchestrator-summary.json"
          --postgres "$GITHUB_WORKSPACE/test-results/nyay5-postgres/summary.json"
          --otp-postgres "$GITHUB_WORKSPACE/test-results/nyay4-postgres/summary.json"
          --manifest-root "$GITHUB_WORKSPACE/test-results/nyay5-browser"
          --output "$GITHUB_WORKSPACE/test-results/nyay5-acceptance/attestations.json"
      - name: Run and require exact NYAY-5 acceptance aggregate PASS
        working-directory: frontend
        run: >-
          npm run qa:nyay5:acceptance --
          --browser "$GITHUB_WORKSPACE/test-results/nyay5-browser/results.json"
          --postgres "$GITHUB_WORKSPACE/test-results/nyay5-postgres/summary.json"
          --otp-postgres "$GITHUB_WORKSPACE/test-results/nyay4-postgres/summary.json"
          --attestations "$GITHUB_WORKSPACE/test-results/nyay5-acceptance/attestations.json"
          --output "$GITHUB_WORKSPACE/test-results/nyay5-acceptance/summary.json"
      - name: Prepare privacy-safe NYAY-5 evidence attestation
        id: evidence_prepare
        if: ${{ always() }}
        run: python "$GITHUB_WORKSPACE/scripts/ci/prepare_uploadable_evidence.py" --profile nyay5 "$GITHUB_WORKSPACE/test-results" "$RUNNER_TEMP/nyay5-uploadable"
      - name: Seal complete evidence inventory
        id: evidence_manifest
        if: ${{ always() }}
        run: python "$GITHUB_WORKSPACE/scripts/ci/evidence_manifest.py" --seal "$RUNNER_TEMP/nyay5-uploadable"
      - name: Scan all evidence for generic credential patterns
        id: evidence_privacy
        if: ${{ always() }}
        run: python "$GITHUB_WORKSPACE/scripts/ci/scan_evidence.py" "$RUNNER_TEMP/nyay5-uploadable"
      - name: Reverify immutable evidence inventory
        id: evidence_integrity
        if: ${{ always() }}
        run: python "$GITHUB_WORKSPACE/scripts/ci/evidence_manifest.py" --verify "$RUNNER_TEMP/nyay5-uploadable"
      - name: Validate exact pre-upload evidence schema
        id: evidence_schema
        if: ${{ always() }}
        run: python "$GITHUB_WORKSPACE/scripts/ci/prepare_uploadable_evidence.py" --validate-attestation "$RUNNER_TEMP/nyay5-uploadable"
      - name: Upload NYAY-5 evidence attestation
        if: ${{ always() && steps.evidence_prepare.outcome == 'success' && steps.evidence_manifest.outcome == 'success' && steps.evidence_privacy.outcome == 'success' && steps.evidence_integrity.outcome == 'success' && steps.evidence_schema.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nyay5-profile-boundary-attestation
          path: ${{ runner.temp }}/nyay5-uploadable
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
      - name: Require complete passing producer results
        id: evidence_result
        if: ${{ always() }}
        run: python "$GITHUB_WORKSPACE/scripts/ci/prepare_uploadable_evidence.py" --require-pass "$RUNNER_TEMP/nyay5-uploadable"

  required:
    name: nyayone-nyay5-required
    if: ${{ always() }}
    needs: [profile-postgres-production-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every upstream job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          results = {
              name: value["result"]
              for name, value in json.loads(os.environ["RESULTS"]).items()
          }
          print(results)
          if not results or any(value != "success" for value in results.values()):
              sys.exit("one or more required jobs did not succeed")
          PY
