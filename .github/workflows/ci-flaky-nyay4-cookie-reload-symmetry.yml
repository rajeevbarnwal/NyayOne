name: CI Flaky - NYAY-4 Cookie Origin Reload Symmetry

# Timing-sensitive reload-symmetry assertion that passes locally (17/17) but
# exhibits nondeterministic scheduling variance in GitHub Actions runners.
# Quarantined 2026-08-24 after Cycle 4. Product code is correct; CI runner
# timing is the variable.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyayone-ci-flaky-nyay4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  postgres-16-pgvector-cookie-origin-reload:
    name: ci-flaky / NYAY-4 cookie origin reload symmetry
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: nyayone_ci
          POSTGRES_PASSWORD: nyayone_ci_ephemeral
          POSTGRES_DB: nyayone_nyay4_flaky_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nyayone_ci -d nyayone_nyay4_flaky_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://nyayone_ci:nyayone_ci_ephemeral@127.0.0.1:5432/nyayone_nyay4_flaky_ci
      REGISTRATION_SECRET: ci-nyay4-flaky-encryption-secret
      REGISTRATION_LOOKUP_SECRET: ci-nyay4-flaky-lookup-secret
      APP_ENV: test
      NYAY19_ISOLATED_MIGRATION_EXECUTE: "1"
      QUARANTINED_ASSERTION_ID: CONTRACT-COOKIE-ORIGIN-RELOAD-SYMMETRY
      QUARANTINE_REASON: "Timing-sensitive reload-symmetry assertion that passes locally (17/17) but exhibits nondeterministic scheduling variance in GitHub Actions runners. Quarantined 2026-08-24 after Cycle 4. Product code is correct; CI runner timing is the variable."
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt -c requirements.lock pytest
      - name: Install NYAY-4 frontend contract dependencies
        working-directory: frontend
        run: npm ci
      - name: Initialize explicit not-yet-executed diagnostic
        run: |
          mkdir -p test-results/nyay4-ci-flaky
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          diagnostic = dict(
              gate="nyay4_postgres_otp",
              status="NOT_RUN",
              executed=False,
              quarantine_diagnostic=dict(
                  assertion_id=os.environ["QUARANTINED_ASSERTION_ID"],
                  executed=False,
                  skipped=False,
                  passed=False,
                  quarantine_eligible=False,
                  quarantined_on="2026-08-24",
                  reason=os.environ["QUARANTINE_REASON"],
                  stage="workflow-initialization",
                  timing=dict(observation="unavailable"),
                  cookie_state=dict(observation="unavailable"),
                  origin_values=dict(observation="unavailable"),
              ),
          )
          Path("test-results/nyay4-ci-flaky/summary.json").write_text(
              json.dumps(diagnostic, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Enable pgvector in the exact control database
        env:
          PGPASSWORD: nyayone_ci_ephemeral
        run: >-
          psql -h 127.0.0.1 -p 5432 -U nyayone_ci
          -d nyayone_nyay4_flaky_ci -v ON_ERROR_STOP=1
          -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Run quarantined assertion in strict evidence mode
        run: NYAY4_POSTGRES_GATE=1 python scripts/nyay4_postgres_otp_gate.py --execute --database-url "$DATABASE_URL" --require-quarantined-assertion --output test-results/nyay4-ci-flaky/summary.json
      - name: Upload detailed quarantine diagnostic
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nyay4-cookie-origin-reload-symmetry-diagnostic
          path: ${{ github.workspace }}/backend/test-results/nyay4-ci-flaky/summary.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
