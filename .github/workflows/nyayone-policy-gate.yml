name: NyayOne policy and security gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyayone-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install hash-locked workflow policy parser
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes --no-deps -r scripts/ci/policy-requirements.lock
      - name: Reject whitespace and patch corruption
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! printf '%s' "$BASE_SHA" | grep -Eq '[^0]'; then
            BASE_SHA="$(git rev-parse "$GITHUB_SHA^")"
          fi
          git diff --check "$BASE_SHA" "$GITHUB_SHA"
      - name: Validate workflow supply-chain policy
        run: |
          python scripts/ci/verify_nyayone_ci.py
          python scripts/ci/test_ci_policies.py
          python scripts/ci/test_evidence_policy.py
      - name: Validate privacy-safe failure diagnostics
        run: python scripts/ci/test_nyay40_failure_digests.py
      - name: Validate NYAY-22 release-gate reachability and source seals
        run: python scripts/ci/test_nyay22_ci_policy.py
      - name: Validate NYAY-11 authority release-gate reachability
        run: python scripts/ci/test_nyay11_ci_policy.py
      - name: Validate NYAY-14 exact-head evidence gate
        run: python scripts/ci/test_nyay14_evidence_gate.py
      - name: Prove NYAY-14 evidence gate fails closed under adversarial inputs
        run: python scripts/ci/test_nyay14_evidence_gate_security.py
      - name: Enforce NYAY-27 future contact-sheet evidence
        run: python scripts/ci/test_nyay27_contact_sheet_gate.py
      - name: Validate NYAY-21 history-purge tooling
        run: python scripts/ci/test_nyay21_history_purge.py
      - name: Validate NYAY-21 path-to-GO seal and restoration ceremony
        run: python scripts/ci/test_nyay21_path_to_go.py
      - name: Validate NYAY-21 execution-time seal architecture
        run: python scripts/ci/test_nyay21_execution_time_seal.py
      - name: Reject malformed NYAY-21 execution-time receipts
        run: python scripts/ci/test_nyay21_execution_adversarial.py
      - name: Validate NYAY-21 concrete ordered execution adapters
        run: python scripts/ci/test_nyay21_executor_adapters.py
      - name: Validate NYAY-21 isolated runtime and synthetic mirror retention
        run: python scripts/ci/test_nyay21_executor_runtime.py
      - name: Validate NYAY-33 documentation reconciliation
        run: python scripts/ci/test_nyay33_documentation_polish.py
      - name: Enforce Sprint 4 evidence hardening contracts
        run: python scripts/ci/test_sprint4_hardening_red.py
      - name: Prove Sprint 4 evidence hardening adversarial boundaries
        run: python scripts/ci/test_sprint4_hardening_adversarial.py
      - name: Validate NyayOne runtime and Compose isolation
        run: |
          cp .env.example .env
          trap 'rm -f .env' EXIT
          docker compose config --format json > "$RUNNER_TEMP/nyayone-compose.json"
          python scripts/ci/check_nyayone_runtime_identity.py \
            --compose-json "$RUNNER_TEMP/nyayone-compose.json"
      - name: Enforce forward-only migration history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python scripts/ci/verify_migration_ledger.py
          python scripts/ci/check_migration_immutability.py "$BASE_SHA" "$GITHUB_SHA"
      - name: Verify every committed evidence manifest
        run: |
          python scripts/ci/verify_sha256_manifests.py
          found=0
          while IFS= read -r manifest; do
            found=1
            package="$(dirname "$manifest")"
            python scripts/ci/scan_evidence.py "$package"
          done < <(git ls-files 'QA/evidence/NYAY-*/**/SHA256SUMS.txt')
          test "$found" = 1
      - name: Prove the evidence scanner fails closed
        run: |
          root="$RUNNER_TEMP/evidence-scanner-selftest"
          if python scripts/ci/scan_evidence.py "$root/missing"; then
            echo "evidence scanner accepted a missing path" >&2
            exit 1
          fi
          mkdir -p "$root/empty"
          if python scripts/ci/scan_evidence.py "$root/empty"; then
            echo "evidence scanner accepted an empty directory" >&2
            exit 1
          fi
          printf '%s\n' 'sanitized evidence' > "$root/not-a-directory.txt"
          if python scripts/ci/scan_evidence.py "$root/not-a-directory.txt"; then
            echo "evidence scanner accepted a file as its root" >&2
            exit 1
          fi
          mkdir -p "$root/canaries"
          while IFS= read -r payload; do
            printf '%s\n' "$payload" > "$root/canaries/leak.txt"
            if python scripts/ci/scan_evidence.py "$root/canaries"; then
              echo "evidence scanner accepted a planted privacy canary" >&2
              exit 1
            fi
          done <<'CANARIES'
          Authorization: Bearer nyayone-ci-planted-canary-0123456789
          {"Authorization":"Bearer nyayone-json-canary-0123456789"}
          {"cookie":"nyayone_session=nyayone-cookie-canary-0123456789"}
          eyJueWF5b25lIjoiY2FuYXJ5In0.eyJzY29wZSI6InRlc3QifQ.c2lnbmF0dXJlLWNhbmFyeQ
          {"otp":"429016"}
          {"mobile":"9876543210"}
          {"institutional_email":"person@nls.ac.in"}
          {"date_of_birth":"2004-03-14"}
          {"first_name":"Aditi"}
          {"localStorage":{"session_token":"opaque-value-123456"}}
          WAVE4_E2E_SESSION_TOKEN=opaque-env-value-123456
          CANARIES
          printf '%s\n' 'sanitized evidence' > "$root/canaries/leak.txt"
          python scripts/ci/scan_evidence.py "$root/canaries"

  required:
    name: nyayone-policy-required
    if: ${{ always() }}
    needs: [policy-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every upstream job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          results = {
              name: value["result"]
              for name, value in json.loads(os.environ["RESULTS"]).items()
          }
          print(results)
          if not results or any(value != "success" for value in results.values()):
              sys.exit("one or more required jobs did not succeed")
          PY
