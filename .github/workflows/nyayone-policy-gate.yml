name: NyayOne policy and security gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyayone-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Reject whitespace and patch corruption
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! printf '%s' "$BASE_SHA" | grep -Eq '[^0]'; then
            BASE_SHA="$(git rev-parse "$GITHUB_SHA^")"
          fi
          git diff --check "$BASE_SHA" "$GITHUB_SHA"
      - name: Validate workflow supply-chain policy
        run: |
          python scripts/ci/verify_nyayone_ci.py
          python scripts/ci/test_ci_policies.py
      - name: Validate NyayOne runtime and Compose isolation
        run: |
          cp .env.example .env
          trap 'rm -f .env' EXIT
          docker compose config --format json > "$RUNNER_TEMP/nyayone-compose.json"
          python scripts/ci/check_nyayone_runtime_identity.py \
            --compose-json "$RUNNER_TEMP/nyayone-compose.json"
      - name: Enforce forward-only migration history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/ci/check_migration_immutability.py "$BASE_SHA" "$GITHUB_SHA"
      - name: Verify every committed evidence manifest
        run: python scripts/ci/verify_sha256_manifests.py
      - name: Prove the evidence scanner fails closed
        run: |
          mkdir -p "$RUNNER_TEMP/evidence-scanner-selftest"
          while IFS= read -r payload; do
            printf '%s\n' "$payload" > "$RUNNER_TEMP/evidence-scanner-selftest/leak.txt"
            if python scripts/ci/scan_evidence.py "$RUNNER_TEMP/evidence-scanner-selftest"; then
              echo "evidence scanner accepted a planted credential: $payload" >&2
              exit 1
            fi
          done <<'CANARIES'
          Authorization: Bearer nyayone-ci-planted-canary-0123456789
          {"Authorization":"Bearer nyayone-json-canary-0123456789"}
          {"cookie":"nyayone_session=nyayone-cookie-canary-0123456789"}
          eyJueWF5b25lIjoiY2FuYXJ5In0.eyJzY29wZSI6InRlc3QifQ.c2lnbmF0dXJlLWNhbmFyeQ
          CANARIES
          rm "$RUNNER_TEMP/evidence-scanner-selftest/leak.txt"
          python scripts/ci/scan_evidence.py "$RUNNER_TEMP/evidence-scanner-selftest"

  required:
    name: nyayone-policy-required
    if: ${{ always() }}
    needs: [policy-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every upstream job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          results = {
              name: value["result"]
              for name, value in json.loads(os.environ["RESULTS"]).items()
          }
          print(results)
          if not results or any(value != "success" for value in results.values()):
              sys.exit("one or more required jobs did not succeed")
          PY
