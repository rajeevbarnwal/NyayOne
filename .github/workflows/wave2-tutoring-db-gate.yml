name: Wave 2 tutoring PostgreSQL gate

# Wave 2 gets the same target-runtime coverage every earlier wave has: the
# pgvector/pgvector:pg16 service image this repo already uses, on push AND on
# pull_request, for every path that can move the Wave 2 schema, its pricing
# authority, its services or the gate itself.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyayone-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wave2-postgres-16-pgvector:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: nyayone_ci
          POSTGRES_PASSWORD: nyayone_ci_ephemeral
          POSTGRES_DB: nyayone_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nyayone_ci -d nyayone_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://nyayone_ci:nyayone_ci_ephemeral@127.0.0.1:5432/nyayone_ci
      APP_ENV: test
      REGISTRATION_SECRET: ci-registration-encryption-secret-not-a-default
      REGISTRATION_LOOKUP_SECRET: ci-registration-lookup-secret-not-a-default
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock

      - name: Install backend
        run: |
          pip install -r requirements.txt -c requirements.lock pytest

      - name: Enable pgvector
        run: |
          PGPASSWORD=nyayone_ci_ephemeral psql -h 127.0.0.1 -U nyayone_ci -d nyayone_ci \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Complete backend suite (SQLite oracle, ONE invocation)
        run: env -u DATABASE_URL python -m pytest -q

      - name: Wave 2 target-runtime gate (PostgreSQL 16 + pgvector)
        # ONE command. It detects the runtime itself and exits 78 BLOCKED rather
        # than reporting a pass it did not earn; on a runner with the service
        # above, 78 would itself be a red build, which is the point.
        run: PYTHON=python bash scripts/wave2_db_gate.sh --output "$GITHUB_WORKSPACE/test-results/wave2-db-gate/summary.json"

      - name: Assert the gate actually EXECUTED (never accept BLOCKED here)
        run: |
          python - <<'PY'
          import json, os, sys
          path = os.path.join(
              os.environ["GITHUB_WORKSPACE"], "test-results", "wave2-db-gate", "summary.json"
          )
          summary = json.load(open(path))
          print(json.dumps({k: summary.get(k) for k in ("status", "executed", "failed_assertions")}, indent=2))
          if summary.get("status") != "PASS" or not summary.get("executed"):
              sys.exit("the Wave 2 PostgreSQL gate did not execute to a PASS on a runner that HAS PostgreSQL 16 + pgvector")
          PY

      - name: LiveKit / TURN smoke — contract only (no media plane in CI)
        # CI has no LiveKit, no coturn and no browser media stack, so this step
        # asserts the honest thing: the smoke script refuses, loudly, with 78.
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-results"
          set +e
          bash infra/video/scripts/livekit_turn_smoke.sh --out "$GITHUB_WORKSPACE/test-results/livekit-smoke" \
            | tee "$GITHUB_WORKSPACE/test-results/livekit-smoke-blocked.txt"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" != "78" ]; then
            echo "expected the LiveKit smoke to exit 78 BLOCKED in CI, got $rc"
            exit 1
          fi
          grep -q "BLOCKED: prerequisite runtime absent" "$GITHUB_WORKSPACE/test-results/livekit-smoke-blocked.txt"

      - name: Scan evidence for credentials
        id: evidence_privacy
        if: ${{ always() }}
        run: python "$GITHUB_WORKSPACE/scripts/ci/scan_evidence.py" "$GITHUB_WORKSPACE/test-results"
      - name: Upload evidence
        if: ${{ always() && steps.evidence_privacy.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wave2-tutoring-db-gate-evidence
          path: test-results
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

  required:
    name: nyayone-wave2-required
    if: ${{ always() }}
    needs: [wave2-postgres-16-pgvector]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every upstream job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          results = {
              name: value["result"]
              for name, value in json.loads(os.environ["RESULTS"]).items()
          }
          print(results)
          if not results or any(value != "success" for value in results.values()):
              sys.exit("one or more required jobs did not succeed")
          PY
