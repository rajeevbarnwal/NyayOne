name: Wave 5 calendar interoperability gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyayone-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  calendar-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: nyayone_ci
          POSTGRES_PASSWORD: nyayone_ci_ephemeral
          POSTGRES_DB: nyayone_wave5_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nyayone_ci -d nyayone_wave5_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://nyayone_ci:nyayone_ci_ephemeral@127.0.0.1:5432/nyayone_wave5_qa
      APP_ENV: testing
      WAVE5_GATE_ALLOW_MUTATION: "true"
      REGISTRATION_SECRET: ci-registration-encryption-secret-not-a-default
      REGISTRATION_LOOKUP_SECRET: ci-registration-lookup-secret-not-a-default
      NYAY19_ISOLATED_MIGRATION_EXECUTE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt -c requirements.lock pytest
      - name: Enable pgvector
        run: PGPASSWORD=nyayone_ci_ephemeral psql -h 127.0.0.1 -U nyayone_ci -d nyayone_wave5_qa -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Native calendar and migration regression
        working-directory: backend
        run: python -m pytest -q tests/test_wave5_calendar.py tests/test_wave2_schema.py tests/test_wave4_schema.py
      - name: PostgreSQL 16 + pgvector calendar gate
        working-directory: backend
        run: python scripts/wave5_postgres_gate.py --output "$GITHUB_WORKSPACE/test-results/wave5-postgres/summary.json"
      - name: Prepare privacy-safe PostgreSQL evidence attestation
        id: evidence_prepare
        if: ${{ always() }}
        run: python "$GITHUB_WORKSPACE/scripts/ci/prepare_uploadable_evidence.py" --profile wave5-postgres "$GITHUB_WORKSPACE/test-results" "$RUNNER_TEMP/wave5-postgres-uploadable"
      - name: Seal complete evidence inventory
        id: evidence_manifest
        if: ${{ always() }}
        run: python "$GITHUB_WORKSPACE/scripts/ci/evidence_manifest.py" --seal "$RUNNER_TEMP/wave5-postgres-uploadable"
      - name: Scan evidence for credentials
        id: evidence_privacy
        if: ${{ always() }}
        run: python "$GITHUB_WORKSPACE/scripts/ci/scan_evidence.py" "$RUNNER_TEMP/wave5-postgres-uploadable"
      - name: Reverify immutable evidence inventory
        id: evidence_integrity
        if: ${{ always() }}
        run: python "$GITHUB_WORKSPACE/scripts/ci/evidence_manifest.py" --verify "$RUNNER_TEMP/wave5-postgres-uploadable"
      - name: Validate exact pre-upload evidence schema
        id: evidence_schema
        if: ${{ always() }}
        run: python "$GITHUB_WORKSPACE/scripts/ci/prepare_uploadable_evidence.py" --validate-attestation "$RUNNER_TEMP/wave5-postgres-uploadable"
      - name: Upload PostgreSQL evidence attestation
        if: ${{ always() && steps.evidence_prepare.outcome == 'success' && steps.evidence_manifest.outcome == 'success' && steps.evidence_privacy.outcome == 'success' && steps.evidence_integrity.outcome == 'success' && steps.evidence_schema.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wave5-calendar-postgres-attestation
          path: ${{ runner.temp }}/wave5-postgres-uploadable
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
      - name: Require complete passing PostgreSQL producer results
        id: evidence_result
        if: ${{ always() }}
        run: python "$GITHUB_WORKSPACE/scripts/ci/prepare_uploadable_evidence.py" --require-pass "$RUNNER_TEMP/wave5-postgres-uploadable"

  calendar-real-browser:
    name: Real PostgreSQL + HTTPS + Chromium S-90–S-93
    needs: calendar-postgres
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: nyayone_ci
          POSTGRES_PASSWORD: nyayone_ci_ephemeral
          POSTGRES_DB: nyayone_wave5_browser_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nyayone_ci -d nyayone_wave5_browser_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://nyayone_ci:nyayone_ci_ephemeral@127.0.0.1:5432/nyayone_wave5_browser_qa
      APP_ENV: testing
      WAVE5_E2E_ALLOW_SEED: "true"
      REGISTRATION_SECRET: ci-wave5-browser-encryption-secret-not-a-default
      REGISTRATION_LOOKUP_SECRET: ci-wave5-browser-lookup-secret-not-a-default
      CORS_ORIGINS: '["https://127.0.0.1:1290"]'
      CALENDAR_PUBLIC_BASE_URL: https://127.0.0.1:1291
      VITE_DISABLE_SERVICE_WORKER: "true"
      NYAY19_ISOLATED_MIGRATION_EXECUTE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Install production frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm exec -- playwright install --with-deps chromium
      - name: Prepare masked session bearer and loopback TLS
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/wave5-tls" "$GITHUB_WORKSPACE/test-results"
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "WAVE5_E2E_SESSION_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/wave5-tls/backend.key" \
            -out "$RUNNER_TEMP/wave5-tls/backend.crt" \
            -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1"
      - name: Migrate and seed the isolated PostgreSQL target
        working-directory: backend
        run: |
          PGPASSWORD=nyayone_ci_ephemeral psql -h 127.0.0.1 -U nyayone_ci \
            -d nyayone_wave5_browser_qa \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"
          alembic upgrade head
          python scripts/seed_wave5_calendar_e2e.py \
            --manifest "$RUNNER_TEMP/wave5-calendar-seed.json"
      - name: Build frontend and start the real HTTPS/API stack
        shell: bash
        run: |
          (cd frontend && VITE_API_BASE_URL=https://127.0.0.1:1291 npm run build)
          (cd backend && python -m uvicorn app.main:app \
            --host 127.0.0.1 --port 1291 --no-access-log \
            --ssl-keyfile "$RUNNER_TEMP/wave5-tls/backend.key" \
            --ssl-certfile "$RUNNER_TEMP/wave5-tls/backend.crt" \
            > "$GITHUB_WORKSPACE/test-results/wave5-real-backend.log" 2>&1 &)
          (cd frontend && \
            TLS_SPA_HOST=127.0.0.1 \
            TLS_SPA_PORT=1290 \
            TLS_SPA_DIST="$GITHUB_WORKSPACE/frontend/dist" \
            TLS_SPA_KEY="$RUNNER_TEMP/wave5-tls/backend.key" \
            TLS_SPA_CERT="$RUNNER_TEMP/wave5-tls/backend.crt" \
            node scripts/serve-dist-tls.mjs \
            > "$GITHUB_WORKSPACE/test-results/wave5-real-frontend.log" 2>&1 &)
          for attempt in {1..90}; do
            curl --fail --silent --insecure https://127.0.0.1:1291/health >/dev/null \
              && curl --fail --silent --insecure https://127.0.0.1:1290/s-90 >/dev/null \
              && break
            test "$attempt" = 90 && exit 1
            sleep 1
          done
      - name: Real S-90–S-93 Chromium release gate
        working-directory: frontend
        env:
          WAVE5_E2E_ALLOW_REAL: "true"
          WAVE5_E2E_ALLOW_SELF_SIGNED_TLS: "true"
          WAVE5_E2E_SEED_MANIFEST: ${{ runner.temp }}/wave5-calendar-seed.json
          E2E_WEB_URL: https://127.0.0.1:1290
          E2E_API_URL: https://127.0.0.1:1291
          E2E_PUBLIC_URL: https://127.0.0.1:1291
          E2E_OUTPUT_DIR: ${{ github.workspace }}/test-results/wave5-real-browser
        run: npm run qa:wave5-calendar-real
      - name: Reject bearer material from uploadable evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import sys

          root = pathlib.Path("test-results")
          session = os.environ.get("WAVE5_E2E_SESSION_TOKEN", "").encode()
          feed = re.compile(rb"/public/calendar-feeds/[A-Za-z0-9_-]{32,160}\.ics")
          failures = []
          for item in (root.rglob("*") if root.exists() else ()):
              if not item.is_file():
                  continue
              data = item.read_bytes()
              if session and session in data:
                  failures.append(f"{item}: raw session bearer")
              if feed.search(data):
                  failures.append(f"{item}: raw feed bearer")
          if failures:
              print("\n".join(failures), file=sys.stderr)
              raise SystemExit(1)
          print("artifact privacy guard: no raw session/feed bearer")
          PY
      - name: Prepare privacy-safe real-browser evidence attestation
        id: evidence_prepare
        if: ${{ always() }}
        run: python "$GITHUB_WORKSPACE/scripts/ci/prepare_uploadable_evidence.py" --profile wave5-real "$GITHUB_WORKSPACE/test-results" "$RUNNER_TEMP/wave5-real-uploadable"
      - name: Seal complete real-browser evidence inventory
        id: evidence_manifest
        if: ${{ always() }}
        run: python "$GITHUB_WORKSPACE/scripts/ci/evidence_manifest.py" --seal "$RUNNER_TEMP/wave5-real-uploadable"
      - name: Scan all real-browser evidence for generic credential patterns
        id: evidence_privacy
        if: ${{ always() }}
        run: python "$GITHUB_WORKSPACE/scripts/ci/scan_evidence.py" "$RUNNER_TEMP/wave5-real-uploadable"
      - name: Reverify immutable real-browser evidence inventory
        id: evidence_integrity
        if: ${{ always() }}
        run: python "$GITHUB_WORKSPACE/scripts/ci/evidence_manifest.py" --verify "$RUNNER_TEMP/wave5-real-uploadable"
      - name: Validate exact pre-upload evidence schema
        id: evidence_schema
        if: ${{ always() }}
        run: python "$GITHUB_WORKSPACE/scripts/ci/prepare_uploadable_evidence.py" --validate-attestation "$RUNNER_TEMP/wave5-real-uploadable"
      - name: Upload real-browser evidence attestation
        if: ${{ always() && steps.evidence_prepare.outcome == 'success' && steps.evidence_manifest.outcome == 'success' && steps.evidence_privacy.outcome == 'success' && steps.evidence_integrity.outcome == 'success' && steps.evidence_schema.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wave5-calendar-real-browser-attestation
          path: ${{ runner.temp }}/wave5-real-uploadable
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
      - name: Require complete passing browser producer results
        id: evidence_result
        if: ${{ always() }}
        run: python "$GITHUB_WORKSPACE/scripts/ci/prepare_uploadable_evidence.py" --require-pass "$RUNNER_TEMP/wave5-real-uploadable"

  required:
    name: nyayone-wave5-required
    if: ${{ always() }}
    needs: [calendar-postgres, calendar-real-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every upstream job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          results = {
              name: value["result"]
              for name, value in json.loads(os.environ["RESULTS"]).items()
          }
          print(results)
          if not results or any(value != "success" for value in results.values()):
              sys.exit("one or more required jobs did not succeed")
          PY
