name: wave1-foundation-gate

# SAATHI-58 / SAATHI-63 — Wave 1 foundation gate. Runs the frontend native gates
# and the SAME backend DB gate as scripts/db_gate.sh against the TARGET database
# (PostgreSQL 16 + pgvector) on every push/PR touching Wave 1 surfaces.
# Supplements (does not weaken) the existing registration-db-gate workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyayone-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - name: Install Chromium for the S-11–S-26 contract gate
        run: npm exec -- playwright install --with-deps chromium
      - name: S-11–S-26 responsive, accessibility, runtime, and API-readiness gate
        run: |
          npm run preview -- --port 4177 > "${RUNNER_TEMP}/v34-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "${PREVIEW_PID}" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4177/ >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "${READY}" -ne 1 ]; then
            cat "${RUNNER_TEMP}/v34-preview.log"
            exit 1
          fi

          V34_BASE_URL=http://127.0.0.1:4177 \
          V34_EVIDENCE_DIR="${RUNNER_TEMP}/v34-s11-s26" \
          npm run qa:v34:s11-s26
      - name: Verify S-11–S-26 evidence manifest
        run: |
          cd "$RUNNER_TEMP/v34-s11-s26"
          sha256sum --check SHA256SUMS.txt
      - name: Prepare privacy-safe S-11–S-26 evidence attestation
        id: evidence_prepare
        if: ${{ always() }}
        run: >-
          python3 "$GITHUB_WORKSPACE/scripts/ci/prepare_uploadable_evidence.py" --profile wave1
          "$RUNNER_TEMP/v34-s11-s26" "$RUNNER_TEMP/v34-s11-s26-uploadable"
      - name: Seal complete S-11–S-26 evidence inventory
        id: evidence_manifest
        if: ${{ always() }}
        run: >-
          python3 "$GITHUB_WORKSPACE/scripts/ci/evidence_manifest.py" --seal
          "$RUNNER_TEMP/v34-s11-s26-uploadable"
      - name: Scan S-11–S-26 browser evidence for credentials
        id: evidence_privacy
        if: ${{ always() }}
        run: >-
          python3 "$GITHUB_WORKSPACE/scripts/ci/scan_evidence.py"
          "$RUNNER_TEMP/v34-s11-s26-uploadable"
      - name: Reverify immutable S-11–S-26 evidence inventory
        id: evidence_integrity
        if: ${{ always() }}
        run: >-
          python3 "$GITHUB_WORKSPACE/scripts/ci/evidence_manifest.py" --verify
          "$RUNNER_TEMP/v34-s11-s26-uploadable"
      - name: Validate exact pre-upload evidence schema
        id: evidence_schema
        if: ${{ always() }}
        run: >-
          python3 "$GITHUB_WORKSPACE/scripts/ci/prepare_uploadable_evidence.py" --validate-attestation
          "$RUNNER_TEMP/v34-s11-s26-uploadable"
      - name: Upload S-11–S-26 evidence attestation
        if: ${{ always() && steps.evidence_prepare.outcome == 'success' && steps.evidence_manifest.outcome == 'success' && steps.evidence_privacy.outcome == 'success' && steps.evidence_integrity.outcome == 'success' && steps.evidence_schema.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v34-s11-s26-browser-attestation
          path: ${{ runner.temp }}/v34-s11-s26-uploadable
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
      - name: Require complete passing S-11–S-26 producer results
        id: evidence_result
        if: ${{ always() }}
        run: >-
          python3 "$GITHUB_WORKSPACE/scripts/ci/prepare_uploadable_evidence.py" --require-pass
          "$RUNNER_TEMP/v34-s11-s26-uploadable"

  backend-postgres16-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: nyayone_ci
          POSTGRES_PASSWORD: nyayone_ci_ephemeral
          POSTGRES_DB: nyayone_ci
        ports:
          - 1032:5432
        options: >-
          --health-cmd "pg_isready -U nyayone_ci -d nyayone_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://nyayone_ci:nyayone_ci_ephemeral@127.0.0.1:1032/nyayone_ci
      APP_ENV: staging
      # Wave 5 fail-closed contract: outside local/test environments the
      # subscriber-facing calendar origin must be a real non-loopback HTTPS
      # origin, so this staging job must state one explicitly instead of
      # inheriting the loopback development default. The reserved .test TLD is
      # never resolved by this job; it only satisfies the origin contract.
      CALENDAR_PUBLIC_BASE_URL: https://calendar.example.test
      # Wave 4 production contract: select the real scanner seam. This
      # regression workflow does not exercise reporting; the dedicated Wave 4
      # gate starts clamd and proves PING + EICAR rejection.
      INTERNSHIP_REPORT_SCANNER_PROVIDER: clamav
      REGISTRATION_SECRET: ci-registration-secret-not-a-dev-default
      REGISTRATION_LOOKUP_SECRET: ci-registration-lookup-secret-not-a-dev-default
      # NYAY-4 startup policy: staging must bind an HTTPS provider that
      # explicitly guarantees idempotent acceptance. This gate never resolves
      # the reserved .test endpoint; native delivery behavior uses injected
      # deterministic senders inside the PostgreSQL characterization.
      OTP_DELIVERY_ENABLED: "true"
      OTP_PROVIDER: http
      OTP_PROVIDER_URL: https://otp-provider.example.test/send
      OTP_PROVIDER_TOKEN: ci-otp-provider-token-not-a-default
      OTP_PROVIDER_SUPPORTS_IDEMPOTENCY: "true"
      # Explicitly marks only this loopback, marker-named CI database as
      # disposable for the NYAY-19 Alembic release guard.
      NYAY19_ISOLATED_MIGRATION_EXECUTE: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          pip install -r requirements.txt -c requirements.lock pytest httpx
      - name: Install NYAY-4 frontend contract dependencies
        working-directory: frontend
        run: npm ci
      - name: Enable pgvector
        run: |
          PGPASSWORD=nyayone_ci_ephemeral psql -h 127.0.0.1 -p 1032 -U nyayone_ci -d nyayone_ci \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Wave 1 + registration DB gate (PostgreSQL 16 + pgvector)
        run: PYTHON=python bash scripts/db_gate.sh
      - name: Upload privacy-safe NYAY-4 failure diagnostic
        if: ${{ failure() && hashFiles('backend/test-results/nyay4-postgres/summary.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nyay4-postgres-failure-diagnostic
          path: ${{ github.workspace }}/backend/test-results/nyay4-postgres/summary.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
      - name: SAATHI-60 owner-scoped save concurrency (isolated PostgreSQL database)
        run: |
          PGPASSWORD=nyayone_ci_ephemeral psql -h 127.0.0.1 -p 1032 -U nyayone_ci -d postgres \
            -c "CREATE DATABASE nyayone_saathi60_ci_qa OWNER nyayone_ci;"
          DATABASE_URL=postgresql+psycopg://nyayone_ci:nyayone_ci_ephemeral@127.0.0.1:1032/nyayone_saathi60_ci_qa \
            python -m alembic upgrade head
          SAATHI60_POSTGRES_TEST_URL=postgresql+psycopg://nyayone_ci:nyayone_ci_ephemeral@127.0.0.1:1032/nyayone_saathi60_ci_qa \
            python -m pytest -q \
              tests/test_saathi60_internships.py::test_parallel_save_is_one_row_and_one_audit_on_postgresql
      - name: Provision deterministic E2E actors (idempotent — run twice, F1)
        # SAATHI-120 F1: the law-school E2E suite requires the dev-claims
        # actors (…00de/…00b2/…00c3) as users rows. This is the explicit
        # repository-owned setup seam; running it twice on real PG16 proves
        # zero-duplicate idempotency (backend/tests/test_seed_e2e_actors.py
        # asserts the same contract natively).
        run: |
          python scripts/seed_e2e_actors.py
          python scripts/seed_e2e_actors.py

  required:
    name: nyayone-wave1-required
    if: ${{ always() }}
    needs: [frontend-native, backend-postgres16-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every upstream job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          results = {
              name: value["result"]
              for name, value in json.loads(os.environ["RESULTS"]).items()
          }
          print(results)
          if not results or any(value != "success" for value in results.values()):
              sys.exit("one or more required jobs did not succeed")
          PY
