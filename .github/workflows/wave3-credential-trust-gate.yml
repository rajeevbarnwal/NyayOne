name: Wave 3 credential trust gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyayone-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  credential-trust-postgres-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: legalsaathi
          POSTGRES_PASSWORD: legalsaathi
          POSTGRES_DB: legalsaathi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legalsaathi -d legalsaathi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://legalsaathi:legalsaathi@127.0.0.1:5432/legalsaathi
      APP_ENV: staging
      # Wave 5 fail-closed contract: outside local/test environments the
      # subscriber-facing calendar origin must be a real non-loopback HTTPS
      # origin, so this staging job must state one explicitly instead of
      # inheriting the loopback development default. The reserved .test TLD is
      # never resolved by this job; it only satisfies the origin contract.
      CALENDAR_PUBLIC_BASE_URL: https://calendar.example.test
      # Wave 4 production contract: select the real scanner seam. Live clamd
      # execution is owned by wave4-private-reporting-gate.yml.
      INTERNSHIP_REPORT_SCANNER_PROVIDER: clamav
      REGISTRATION_SECRET: ci-registration-encryption-secret-not-a-default
      REGISTRATION_LOOKUP_SECRET: ci-registration-lookup-secret-not-a-default
      CREDENTIAL_TOKEN_SECRET: ci-credential-token-secret-not-a-default
      CREDENTIAL_STORAGE_ROOT: ${{ github.workspace }}/test-results/credential-objects
      CREDENTIAL_PUBLIC_BASE_URL: https://verify.example.test/verify
      CORS_ORIGINS: '["http://127.0.0.1:1170","http://localhost:1170"]'
      OTP_DELIVERY_ENABLED: "true"
      OTP_PROVIDER: http
      OTP_PROVIDER_URL: http://127.0.0.1:1099/send
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare evidence directory
        run: |
          mkdir -p test-results
          {
            echo "commit=${GITHUB_SHA}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "runner=${RUNNER_OS}"
          } > test-results/ci-context.txt

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: |
          pip install -r requirements.txt -c requirements.lock pytest

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm exec -- playwright install --with-deps chromium

      - name: Enable pgvector
        run: |
          PGPASSWORD=legalsaathi psql -h 127.0.0.1 -U legalsaathi -d legalsaathi \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Native frontend gates
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint
          npm run test:run
          npm run build

      - name: PostgreSQL migration and full backend gate
        working-directory: backend
        run: PYTHON=python bash scripts/db_gate.sh

      - name: Wave 3 seed idempotency and target-runtime checks
        working-directory: backend
        run: |
          python scripts/seed_wave3_e2e.py
          python scripts/seed_wave3_e2e.py
          WAVE3_POSTGRES_TEST=1 python -m pytest -q tests/test_wave3_postgres_runtime.py
          # The target test removes its isolated Wave 3 rows at teardown.
          # Re-provision the browser actors and issuer for the HTTP/UI phase.
          python scripts/seed_wave3_e2e.py
          python scripts/seed_wave3_e2e.py

      - name: Start OTP, backend and frontend
        run: |
          mkdir -p test-results
          (cd backend && python scripts/otp_capture_server.py > ../test-results/otp.log 2>&1 &)
          # The browser harness uses the repository's deterministic
          # X-Actor-Claims seam. Keep that seam confined to this test process;
          # the preceding migration/full-backend gate still runs with the
          # job-level APP_ENV=staging, where unsigned claims are rejected.
          (cd backend && APP_ENV=test python -m uvicorn app.main:app --host 127.0.0.1 --port 1171 > ../test-results/backend.log 2>&1 &)
          (cd frontend && VITE_API_BASE_URL=http://127.0.0.1:1171 npm run dev -- --host 127.0.0.1 --port 1170 > ../test-results/frontend.log 2>&1 &)
          for url in \
            http://127.0.0.1:1099/health \
            http://127.0.0.1:1171/health \
            http://127.0.0.1:1170; do
            for attempt in {1..60}; do
              curl --fail --silent "$url" >/dev/null && break
              if [[ "$attempt" == 60 ]]; then
                echo "Timed out waiting for $url"
                exit 1
              fi
              sleep 1
            done
          done

      - name: Credential Chromium matrix
        working-directory: frontend
        env:
          E2E_WEB_URL: http://127.0.0.1:1170
          E2E_API_URL: http://127.0.0.1:1171
          E2E_OUTPUT_DIR: ${{ github.workspace }}/test-results/credentials
        run: npm run qa:credentials

      - name: Registration Chromium regression
        working-directory: frontend
        env:
          QA_BASE_URL: http://127.0.0.1:1170
          QA_OTP_CAPTURE_URL: http://127.0.0.1:1099
          QA_EVIDENCE_DIR: ${{ github.workspace }}/test-results/registration
        run: npm run qa:registration

      - name: S-01–S-10 authentication and registration Chromium regression
        working-directory: frontend
        env:
          V34_BASE_URL: http://127.0.0.1:1170
          V34_API_BASE_URL: http://127.0.0.1:1171
          V34_OTP_CAPTURE_URL: http://127.0.0.1:1099
          V34_EVIDENCE_DIR: ${{ github.workspace }}/test-results/v34-s01-s10
        run: npm run qa:v34:s01-s10

      - name: Verify registration and S-01–S-10 evidence manifests
        run: |
          (cd test-results/registration && sha256sum --check SHA256SUMS.txt)
          (cd test-results/v34-s01-s10 && sha256sum --check SHA256SUMS.txt)

      - name: Scan evidence for credentials
        id: evidence_privacy
        if: ${{ always() }}
        run: python scripts/ci/scan_evidence.py test-results
      - name: Upload evidence
        if: ${{ always() && steps.evidence_privacy.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wave3-credential-trust-evidence
          path: test-results
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

  required:
    name: nyayone-wave3-required
    if: ${{ always() }}
    needs: [credential-trust-postgres-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every upstream job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          results = {
              name: value["result"]
              for name, value in json.loads(os.environ["RESULTS"]).items()
          }
          print(results)
          if not results or any(value != "success" for value in results.values()):
              sys.exit("one or more required jobs did not succeed")
          PY
