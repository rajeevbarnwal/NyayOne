name: NYAY-42 optimization observation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyayone-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Non-required rollout; not consumed as producer success by any aggregator.
# Activation and runner migration require separately verified rollout evidence.
jobs:
  optimization-observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/ci/policy-requirements.lock
      - name: Install hash-locked parser
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes --no-deps -r scripts/ci/policy-requirements.lock
      - name: Observe optimization negative contracts
        run: python scripts/ci/test_nyay42_optimization.py
      - name: Record proposed exact-head selection without skipping producers
        env:
          REVIEWED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_HEAD: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          OBSERVED_EVENT: ${{ github.event_name }}
        run: |
          python scripts/ci/nyay42_optimization.py --base "$BASE_HEAD" --head "$REVIEWED_HEAD" --event "$OBSERVED_EVENT" >> "$GITHUB_STEP_SUMMARY"

  # Standalone storage maintenance: owner-dispatched on main only.
  # No checkout, PR-controlled code, artifact deletion, or public evidence changes.
  closed-pr-cache-cleanup:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - name: Remove only unused closed-PR merge caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '7 days ago' +%s)
          gh api --paginate "repos/$REPOSITORY/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.id, .ref, .last_accessed_at] | @tsv' |
          while IFS=$'\t' read -r cache_id cache_ref accessed; do
            [[ "$cache_id" =~ ^[0-9]+$ ]] || exit 1
            [[ "$cache_ref" =~ ^refs/pull/([0-9]+)/merge$ ]] || continue
            pr_number="${BASH_REMATCH[1]}"
            [[ $(date -u -d "$accessed" +%s) -lt $cutoff ]] || continue
            [[ $(gh api "repos/$REPOSITORY/pulls/$pr_number" --jq .state) == closed ]] || continue
            # Re-read the exact ID/ref/timestamp before removal.
            fresh=$(gh api "repos/$REPOSITORY/actions/caches?ref=$cache_ref&per_page=100" \
              --jq ".actions_caches[] | select(.id == $cache_id) | [.ref, .last_accessed_at] | @tsv")
            [[ "$fresh" == "$cache_ref"$'\t'"$accessed" ]] || continue
            gh api --method DELETE "repos/$REPOSITORY/actions/caches/$cache_id"
            echo "Removed closed-PR cache ID $cache_id" >> "$GITHUB_STEP_SUMMARY"
          done
