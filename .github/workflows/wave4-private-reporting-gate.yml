name: Wave 4 private reporting gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nyayone-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  private-reporting-postgres-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: nyayone_ci
          POSTGRES_PASSWORD: nyayone_ci_ephemeral
          POSTGRES_DB: nyayone_wave4_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nyayone_ci -d nyayone_wave4_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      clamav:
        image: clamav/clamav@sha256:78810772a92b4a9168115bc6b2e0ffd702640893b9577f8c3d0432762d2655c4
        ports:
          - 3310:3310
    env:
      DATABASE_URL: postgresql+psycopg://nyayone_ci:nyayone_ci_ephemeral@127.0.0.1:5432/nyayone_wave4_qa
      TEST_DATABASE_URL: postgresql+psycopg://nyayone_ci:nyayone_ci_ephemeral@127.0.0.1:5432/nyayone_wave4_qa
      APP_ENV: testing
      WAVE4_GATE_ALLOW_MUTATION: "true"
      INTERNSHIP_RISK_LABELS_ENABLED: "false"
      REGISTRATION_SECRET: ci-registration-encryption-secret-not-a-default
      REGISTRATION_LOOKUP_SECRET: ci-registration-lookup-secret-not-a-default
      INTERNSHIP_REPORT_STORAGE_ROOT: ${{ github.workspace }}/test-results/report-evidence
      INTERNSHIP_REPORT_SCANNER_PROVIDER: clamav
      INTERNSHIP_REPORT_CLAMAV_HOST: 127.0.0.1
      INTERNSHIP_REPORT_CLAMAV_PORT: 3310
      CORS_ORIGINS: '["http://127.0.0.1:1260","http://localhost:1260","http://127.0.0.1:1263","http://localhost:1263"]'
      NYAY19_ISOLATED_MIGRATION_EXECUTE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt -c requirements.lock pytest
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npm exec -- playwright install --with-deps chromium
      - name: Enable pgvector
        run: PGPASSWORD=nyayone_ci_ephemeral psql -h 127.0.0.1 -U nyayone_ci -d nyayone_wave4_qa -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Require a live ClamAV engine
        run: |
          python - <<'PY'
          import socket, struct, sys, time
          eicar = (
              b"X5O!P%@AP[4\\PZX54(P^)7CC)7}$EICAR-STANDARD-"
              b"ANTIVIRUS-TEST-FILE!$H+H*"
          )
          objects = [
              b"<< /Type /Catalog /Pages 4 0 R /Names << /EmbeddedFiles "
              b"<< /Names [(eicar.com) 2 0 R] >> >> >>",
              b"<< /Type /Filespec /F (eicar.com) /UF (eicar.com) "
              b"/EF << /F 3 0 R /UF 3 0 R >> >>",
              (
                  f"<< /Type /EmbeddedFile /Length {len(eicar)} >>\nstream\n".encode()
                  + eicar
                  + b"\nendstream"
              ),
              b"<< /Type /Pages /Kids [] /Count 0 >>",
          ]
          chunks = [b"%PDF-1.7\n"]
          offsets = []
          for number, body in enumerate(objects, 1):
              offsets.append(sum(map(len, chunks)))
              chunks.extend([f"{number} 0 obj\n".encode(), body, b"\nendobj\n"])
          xref_offset = sum(map(len, chunks))
          xref = (
              b"xref\n0 5\n0000000000 65535 f \n"
              + b"".join(f"{offset:010d} 00000 n \n".encode() for offset in offsets)
              + b"trailer\n<< /Size 5 /Root 1 0 R >>\nstartxref\n"
              + str(xref_offset).encode()
              + b"\n%%EOF\n"
          )
          infected_pdf = b"".join(chunks + [xref])
          for attempt in range(120):
              try:
                  with socket.create_connection(("127.0.0.1", 3310), timeout=2) as sock:
                      sock.settimeout(2)
                      sock.sendall(b"zINSTREAM\0")
                      sock.sendall(struct.pack("!I", len(infected_pdf)) + infected_pdf)
                      sock.sendall(struct.pack("!I", 0))
                      verdict = sock.recv(4096).rstrip(b"\0\r\n")
                      if verdict.endswith(b" FOUND"):
                          print("clamd signature database ready; EICAR detected")
                          break
              except OSError:
                  pass
              time.sleep(2)
          else:
              sys.exit(
                  "ClamAV signature database did not detect EICAR; "
                  "malware screening cannot be claimed"
              )
          PY
      - name: Native regression gates
        run: |
          (cd backend && env -u DATABASE_URL python -m pytest -q)
          (cd frontend && npm run typecheck && npm run lint && npm run test:run && npm run build)
      - name: PostgreSQL 16 + pgvector Wave 4 gate
        working-directory: backend
        env:
          WAVE4_GATE_ALLOW_PUBLICATION_TEST: "true"
          WAVE4_SECURITY_APPROVAL_REF: QA-SECURITY-TARGET-RUNTIME-ONLY
          WAVE4_POLICY_APPROVAL_REF: QA-POLICY-TARGET-RUNTIME-ONLY
          WAVE4_TARGET_RUNTIME_GATE_REF: QA-WAVE4-POSTGRES-CHROMIUM
        run: PYTHON=python bash scripts/wave4_db_gate.sh "$GITHUB_WORKSPACE/test-results/wave4-postgres/summary.json"
      - name: Generate environment-only Wave 4 browser credentials
        run: |
          python - <<'PY'
          import os
          import secrets

          names = (
              "WAVE4_E2E_SESSION_TOKEN",
              "WAVE4_E2E_SAFETY_SESSION_TOKEN",
              "WAVE4_E2E_LEGAL_SESSION_TOKEN",
              "WAVE4_E2E_RESPONSE_TOKEN",
              "WAVE4_E2E_EXPIRED_RESPONSE_TOKEN",
              "WAVE4_E2E_BOUNDARY_RESPONSE_TOKEN",
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for name in names:
                  value = secrets.token_urlsafe(48)
                  # Register the value with GitHub's log masker before any
                  # downstream process can accidentally echo it.
                  print(f"::add-mask::{value}")
                  output.write(f"{name}={value}\n")
          print("Generated six isolated credentials; raw values were not logged")
          PY
      - name: Seed actors and moderation fixtures, then start app boundaries
        env:
          WAVE4_E2E_ALLOW_SEED: "true"
        run: |
          mkdir -p test-results
          (cd backend && python scripts/seed_e2e_actors.py)
          (cd backend && python -m scripts.seed_wave4_moderation_e2e)
          (cd frontend && VITE_INTERNSHIP_RISK_LABELS_ENABLED=true VITE_API_BASE_URL=http://127.0.0.1:1261 npm exec -- vite build --outDir "$RUNNER_TEMP/wave4-frontend-enabled")
          (cd frontend && VITE_INTERNSHIP_RISK_LABELS_ENABLED=false VITE_API_BASE_URL=http://127.0.0.1:1262 npm exec -- vite build --outDir "$RUNNER_TEMP/wave4-frontend-disabled")
          (cd backend && env -u WAVE4_E2E_ALLOW_SEED WAVE4_GATE_ALLOW_PUBLICATION_TEST=true WAVE4_SECURITY_APPROVAL_REF=QA-SECURITY-TARGET-RUNTIME-ONLY WAVE4_POLICY_APPROVAL_REF=QA-POLICY-TARGET-RUNTIME-ONLY WAVE4_TARGET_RUNTIME_GATE_REF=QA-WAVE4-POSTGRES-CHROMIUM python -m uvicorn app.main:app --host 127.0.0.1 --port 1261 > ../test-results/wave4-backend-enabled.log 2>&1 &)
          (cd backend && env -u WAVE4_E2E_ALLOW_SEED WAVE4_GATE_ALLOW_PUBLICATION_TEST=false python -m uvicorn app.main:app --host 127.0.0.1 --port 1262 > ../test-results/wave4-backend-disabled.log 2>&1 &)
          (cd frontend && npm exec -- vite preview --host 127.0.0.1 --port 1260 --strictPort --outDir "$RUNNER_TEMP/wave4-frontend-enabled" > ../test-results/wave4-frontend-enabled.log 2>&1 &)
          (cd frontend && npm exec -- vite preview --host 127.0.0.1 --port 1263 --strictPort --outDir "$RUNNER_TEMP/wave4-frontend-disabled" > ../test-results/wave4-frontend-disabled.log 2>&1 &)
          for url in http://127.0.0.1:1261/health http://127.0.0.1:1262/health http://127.0.0.1:1260/s-86 http://127.0.0.1:1263/s-88; do
            for attempt in {1..60}; do curl --fail --silent "$url" >/dev/null && break; test "$attempt" = 60 && exit 1; sleep 1; done
          done
      - name: S-86/S-87 Chromium and negative matrix
        working-directory: frontend
        env:
          E2E_WEB_URL: http://127.0.0.1:1260
          E2E_API_URL: http://127.0.0.1:1261
          E2E_OUTPUT_DIR: ${{ github.workspace }}/test-results/wave4-browser
        run: npm run qa:wave4-reporting
      - name: MOD-01/MOD-02/MOD-03 moderation Chromium and privacy matrix
        working-directory: frontend
        env:
          WAVE4_E2E_ALLOW_RUN: "true"
          WAVE4_E2E_PUBLICATION_GATE_OPEN: "true"
          E2E_WEB_URL: http://127.0.0.1:1260
          E2E_API_URL: http://127.0.0.1:1261
          E2E_OUTPUT_DIR: ${{ github.workspace }}/test-results/wave4-moderation-browser
        run: npm run qa:wave4-moderation
      - name: Seed governed risk-label fixtures after moderation
        env:
          WAVE4_E2E_ALLOW_SEED: "true"
          WAVE4_GATE_ALLOW_PUBLICATION_TEST: "true"
          WAVE4_SECURITY_APPROVAL_REF: QA-SECURITY-TARGET-RUNTIME-ONLY
          WAVE4_POLICY_APPROVAL_REF: QA-POLICY-TARGET-RUNTIME-ONLY
          WAVE4_TARGET_RUNTIME_GATE_REF: QA-WAVE4-POSTGRES-CHROMIUM
          WAVE4_E2E_FIXTURE_OUTPUT: ${{ github.workspace }}/test-results/wave4-risk-label-fixture.json
        run: (cd backend && python -m scripts.seed_wave4_risk_labels_e2e)
      - name: S-88/S-89 public projection and right-of-reply Chromium matrix
        working-directory: frontend
        env:
          WAVE4_E2E_ALLOW_RUN: "true"
          WAVE4_E2E_ALLOW_DELIVERY_CAPTURE: "true"
          WAVE4_E2E_ALLOW_SOURCE_INVALIDATION: "true"
          WAVE4_E2E_DATABASE_DIALECT: postgresql
          WAVE4_E2E_FIXTURE_PATH: ${{ github.workspace }}/test-results/wave4-risk-label-fixture.json
          E2E_WEB_URL: http://127.0.0.1:1260
          E2E_API_URL: http://127.0.0.1:1261
          E2E_DISABLED_WEB_URL: http://127.0.0.1:1263
          E2E_DISABLED_API_URL: http://127.0.0.1:1262
          E2E_OUTPUT_DIR: ${{ github.workspace }}/test-results/wave4-risk-label-browser
        run: npm run qa:wave4-risk-labels
      - name: Prove invitation and session credentials are absent from evidence
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          names = (
              "WAVE4_E2E_SESSION_TOKEN",
              "WAVE4_E2E_SAFETY_SESSION_TOKEN",
              "WAVE4_E2E_LEGAL_SESSION_TOKEN",
              "WAVE4_E2E_RESPONSE_TOKEN",
              "WAVE4_E2E_EXPIRED_RESPONSE_TOKEN",
              "WAVE4_E2E_BOUNDARY_RESPONSE_TOKEN",
          )
          secrets = {
              name: os.environ[name].encode()
              for name in names
              if os.environ.get(name)
          }
          if not secrets:
              print("No Wave 4 browser credentials were generated before this failed gate")
              raise SystemExit(0)
          leaks = []
          for item in Path("test-results").rglob("*"):
              if not item.is_file():
                  continue
              data = item.read_bytes()
              for name, secret in secrets.items():
                  if secret in data:
                      leaks.append(f"{item}:{name}")
          if leaks:
              raise SystemExit("Raw credential found in evidence: " + ", ".join(leaks))
          print("Privacy scan passed: no raw Wave 4 browser credential in evidence")
          PY
      - name: Prepare privacy-safe evidence attestation
        id: evidence_prepare
        if: ${{ always() }}
        run: python "$GITHUB_WORKSPACE/scripts/ci/prepare_uploadable_evidence.py" --profile wave4 "$GITHUB_WORKSPACE/test-results" "$RUNNER_TEMP/wave4-uploadable"
      - name: Seal complete evidence inventory
        id: evidence_manifest
        if: ${{ always() }}
        run: python "$GITHUB_WORKSPACE/scripts/ci/evidence_manifest.py" --seal "$RUNNER_TEMP/wave4-uploadable"
      - name: Scan all evidence for generic credential patterns
        id: evidence_privacy
        if: ${{ always() }}
        run: python "$GITHUB_WORKSPACE/scripts/ci/scan_evidence.py" "$RUNNER_TEMP/wave4-uploadable"
      - name: Reverify immutable evidence inventory
        id: evidence_integrity
        if: ${{ always() }}
        run: python "$GITHUB_WORKSPACE/scripts/ci/evidence_manifest.py" --verify "$RUNNER_TEMP/wave4-uploadable"
      - name: Validate exact pre-upload evidence schema
        id: evidence_schema
        if: ${{ always() }}
        run: python "$GITHUB_WORKSPACE/scripts/ci/prepare_uploadable_evidence.py" --validate-attestation "$RUNNER_TEMP/wave4-uploadable"
      - name: Upload evidence attestation
        if: ${{ always() && steps.evidence_prepare.outcome == 'success' && steps.evidence_manifest.outcome == 'success' && steps.evidence_privacy.outcome == 'success' && steps.evidence_integrity.outcome == 'success' && steps.evidence_schema.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wave4-private-reporting-attestation
          path: ${{ runner.temp }}/wave4-uploadable
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
      - name: Require complete passing producer results
        id: evidence_result
        if: ${{ always() }}
        run: python "$GITHUB_WORKSPACE/scripts/ci/prepare_uploadable_evidence.py" --require-pass "$RUNNER_TEMP/wave4-uploadable"

  required:
    name: nyayone-wave4-required
    if: ${{ always() }}
    needs: [private-reporting-postgres-browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every upstream job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          results = {
              name: value["result"]
              for name, value in json.loads(os.environ["RESULTS"]).items()
          }
          print(results)
          if not results or any(value != "success" for value in results.values()):
              sys.exit("one or more required jobs did not succeed")
          PY
