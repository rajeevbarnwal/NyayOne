name: Registration PostgreSQL Gate

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/registration-db-gate.yml"
  workflow_dispatch:

jobs:
  postgres-16-pgvector:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legalsaathi
          POSTGRES_PASSWORD: legalsaathi
          POSTGRES_DB: legalsaathi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legalsaathi -d legalsaathi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://legalsaathi:legalsaathi@127.0.0.1:5432/legalsaathi
      REGISTRATION_SECRET: ci-registration-encryption-secret
      REGISTRATION_LOOKUP_SECRET: ci-registration-lookup-secret
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt -r requirements.lock pytest
      - run: PYTHON=python bash scripts/db_gate.sh
