# LegalSaathi local dev — standardized on host port range 1030-1049.
# Reserved: frontend 1030, backend 1031, Postgres 1032, Valkey 1033,
# SeaweedFS S3 API 1035, SeaweedFS admin/UI 1036, LLM Gateway 1037.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: legalsaathi
      POSTGRES_PASSWORD: legalsaathi
      POSTGRES_DB: legalsaathi
    ports:
      - "1032:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalsaathi"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env
    ports:
      - "1031:1031"
    volumes:
      - ./backend:/app
      - ./storage:/workspace/storage
      - ./data:/workspace/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "1030:1030"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
